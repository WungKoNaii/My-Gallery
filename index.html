<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h2>Sign in to watch your photos</h2>
<form action="gallery.html">
    <label for="first">First Name: </label>
    <input type="text" id="first" required>
    <label for="last">Last Name: </label>
    <input type="text" id="last" required>
    <br><br>
    <label for="email">Enter your email: </label><br>
    <input type="email" id="email">
    <br><br>
    <label for="password">Enter your password: </label><br>
    <input type="password" id="password" required>
    <br><br>
    <label for="birth">Date of Birth: </label><br>
    <input type="datetime-local" id="birth" required>
    <br><br>
    Choose your gender: <br>
    <input type="radio" name="gender">Male
    <input type="radio" name="gender">Female
    <input type="radio" name="gender">Others
    <br><br>
    Choose your hobbies: <br>
    <input type="checkbox" name="hobby1">Football
    <input type="checkbox" name="hobby2">Music
    <input type="checkbox" name="hobby3">Reading
    <input type="checkbox" name="hobby4">Drinking
    <input type="checkbox" name="hobby5">Writing
    <br><br>
    Choose your city:
    <select>
        <option>Rangon</option>
        <option>Sittway</option>
        <option>Ponnagyun</option>
        <option>Mandalay</option>
        <option>Kyauktaw</option>
        <option>Taunggyi</option>
        <option>Taunggope</option>
        <option>Mraukoo</option>
    </select>
    <br><br>
    <button type="submit">Sign in</button>
</form>    
</body>
</html>
